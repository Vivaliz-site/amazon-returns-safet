name: Olist Login Envelope
run-name: Olist Login Envelope ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Non-secret correlation identifier
        required: true
        type: string
      recipient_cert_b64:
        description: Base64-encoded short-lived X.509 recipient certificate
        required: true
        type: string

permissions:
  contents: read

jobs:
  envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OLIST_ERP_LOGIN_EMAIL: ${{ secrets.OLIST_ERP_LOGIN_EMAIL }}
      OLIST_ERP_LOGIN_PASSWORD: ${{ secrets.OLIST_ERP_LOGIN_PASSWORD }}
      RECIPIENT_CERT_B64: ${{ inputs.recipient_cert_b64 }}
    steps:
      - name: Create recipient-encrypted login envelope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$OLIST_ERP_LOGIN_EMAIL"
          test -n "$OLIST_ERP_LOGIN_PASSWORD"
          test -n "$RECIPIENT_CERT_B64"

          printf '%s' "$RECIPIENT_CERT_B64" | base64 --decode > recipient.crt
          openssl x509 -in recipient.crt -noout -checkend 3600
          bits="$(openssl x509 -in recipient.crt -noout -pubkey \
            | openssl pkey -pubin -text -noout 2>/dev/null \
            | awk '/Public-Key:/{gsub(/[()]/,"",$2); print $2; exit}')"
          test "${bits:-0}" -ge 3072

          printf 'OLIST_ERP_LOGIN_EMAIL=%s\nOLIST_ERP_LOGIN_PASSWORD=%s\n' \
            "$OLIST_ERP_LOGIN_EMAIL" "$OLIST_ERP_LOGIN_PASSWORD" > olist-login.env

          openssl cms -encrypt -binary -aes256 \
            -in olist-login.env \
            -out olist-login.cms \
            -outform DER \
            recipient.crt

          rm -f olist-login.env recipient.crt
          test -s olist-login.cms

      - name: Upload encrypted envelope only
        uses: actions/upload-artifact@v4
        with:
          name: olist-login-envelope
          path: olist-login.cms
          if-no-files-found: error
          retention-days: 1
