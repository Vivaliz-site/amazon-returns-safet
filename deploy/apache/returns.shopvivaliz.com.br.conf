<VirtualHost *:80>
    ServerName returns.shopvivaliz.com.br
    Redirect permanent / https://returns.shopvivaliz.com.br/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName returns.shopvivaliz.com.br
    DocumentRoot /home/ubuntu/amazon-returns-deploy/current

    <Directory /home/ubuntu/amazon-returns-deploy/current>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <LocationMatch "^/api/amazon-returns/(bridge|status-bridge)\.php$">
        LimitRequestBody 131072
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"

    ErrorLog ${APACHE_LOG_DIR}/amazon-returns-error.log
    CustomLog ${APACHE_LOG_DIR}/amazon-returns-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/returns.shopvivaliz.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/returns.shopvivaliz.com.br/privkey.pem

    SSLCACertificateFile /etc/ssl/certs/cloudflare-origin-pull-ca.pem
    SSLVerifyClient require
    SSLVerifyDepth 1
</VirtualHost>
</IfModule>
