<VirtualHost *:80>
    ServerName returns.shopvivaliz.com.br
    DocumentRoot /home/ubuntu/amazon-returns-deploy/current

    <Directory /home/ubuntu/amazon-returns-deploy/current>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/amazon-returns-http-error.log
    CustomLog ${APACHE_LOG_DIR}/amazon-returns-http-access.log combined
</VirtualHost>
