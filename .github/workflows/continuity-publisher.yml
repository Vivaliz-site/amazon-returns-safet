name: Continuity Publisher

on:
  workflow_run:
    workflows: ['Continuity Signal']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continuity-publisher-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify triggering branch head is unchanged
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          test "$current" = "$EXPECTED_HEAD"

      - name: Reject privileged workflow changes independently
        run: |
          set -euo pipefail
          compare="$(gh api "repos/$REPOSITORY/compare/main...$EXPECTED_HEAD")"
          if ! jq -e '(.files | length < 300) and all(.files[]; ((.filename | startswith(".github/workflows/")) or ((.previous_filename // "") | startswith(".github/workflows/")) | not))' <<<"$compare" >/dev/null; then
            echo 'Automatic continuity branches may not modify .github/workflows/ or exceed the bounded compare file set.' >&2
            exit 1
          fi

      - name: Create or reuse pull request
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --base main --state open --json url --jq '.[0].url // ""')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --fill)"
          fi
          test -n "$pr_url"
          printf 'PR_URL=%s\n' "$pr_url" >> "$GITHUB_ENV"

      - name: Wait for Amazon Returns CI run to appear
        run: |
          set -euo pipefail
          ci_run_id=""
          for attempt in $(seq 1 30); do
            runs="$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$EXPECTED_HEAD" -f event=pull_request -F per_page=100)"
            ci_run_id="$(jq -r '.workflow_runs[] | select(.name == "Amazon Returns CI") | .id' <<<"$runs" | head -n1)"
            if [ -n "$ci_run_id" ] && [ "$ci_run_id" != "null" ]; then
              printf 'CI_RUN_ID=%s\n' "$ci_run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo 'Amazon Returns CI run did not appear within the bounded wait.' >&2
          exit 1

      - name: Require Amazon Returns CI success
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_json="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 10
          done
          echo 'Amazon Returns CI did not complete within the bounded wait.' >&2
          exit 1

      - name: Enable auto-merge after checks are green
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --repo "$REPOSITORY" --auto --squash --delete-branch
