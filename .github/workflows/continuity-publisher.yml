name: Continuity Publisher

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continuity-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create or reuse pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // ""')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$BRANCH" --fill)"
          fi
          test -n "$pr_url"
          printf 'PR_URL=%s\n' "$pr_url" >> "$GITHUB_ENV"

      - name: Wait for required checks to appear
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            checks="$(gh pr checks "$PR_URL" --json name,state,bucket 2>/dev/null || true)"
            if [ "$checks" != "[]" ] && [ -n "$checks" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'No pull-request checks appeared within the bounded wait.' >&2
          exit 1

      - name: Require green pull-request checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_URL" --watch --fail-fast

      - name: Enable auto-merge after checks are green
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --squash --delete-branch
