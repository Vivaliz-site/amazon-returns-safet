name: Continuity Publisher

on:
  workflow_run:
    workflows: ['Continuity Signal']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continuity-publisher-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify triggering branch head is unchanged
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          test "$current" = "$EXPECTED_HEAD"

      - name: Create or reuse pull request
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --base main --state open --json url --jq '.[0].url // ""')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --fill)"
          fi
          test -n "$pr_url"
          printf 'PR_URL=%s\n' "$pr_url" >> "$GITHUB_ENV"

      - name: Wait for required checks to appear
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            checks="$(gh pr checks "$PR_URL" --repo "$REPOSITORY" --json name,state,bucket 2>/dev/null || true)"
            if [ "$checks" != "[]" ] && [ -n "$checks" ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'No pull-request checks appeared within the bounded wait.' >&2
          exit 1

      - name: Require green pull-request checks
        run: |
          set -euo pipefail
          gh pr checks "$PR_URL" --repo "$REPOSITORY" --watch --fail-fast

      - name: Enable auto-merge after checks are green
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --repo "$REPOSITORY" --auto --squash --delete-branch
