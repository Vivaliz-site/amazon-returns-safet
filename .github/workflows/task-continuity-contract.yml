name: Global Task Continuity Contract

on:
  pull_request:
    paths:
      - "scripts/agent_task_state.py"
      - "tests/test_global_task_continuity_adapter.py"
      - "docs/knowledge/task-continuity.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/workflows/task-continuity-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/agent_task_state.py"
      - "tests/test_global_task_continuity_adapter.py"
      - "docs/knowledge/task-continuity.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/workflows/task-continuity-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate adapter
        run: |
          set -Eeuo pipefail
          python3 -m unittest tests.test_global_task_continuity_adapter -v
          python3 scripts/agent_task_state.py --adapter-self-test
          grep -Fq "GLOBAL_TASK_CONTINUITY_V8" AGENTS.md
      - run: grep -Fq "CHECKPOINT_FIRST_V9" AGENTS.md
          grep -Fq "GLOBAL_TASK_CONTINUITY_V8" docs/knowledge/task-continuity.md
