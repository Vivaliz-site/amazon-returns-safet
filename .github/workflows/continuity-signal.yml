name: Continuity Signal

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record isolated branch signal
        env:
          CONTINUITY_BRANCH: ${{ github.ref_name }}
          CONTINUITY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          printf 'continuity_signal_branch=%s\n' "$CONTINUITY_BRANCH"
          printf 'continuity_signal_sha=%s\n' "$CONTINUITY_SHA"
