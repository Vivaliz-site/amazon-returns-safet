name: Repository Governance Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate repository governance
        run: bash scripts/repository-governance-validate.sh ci
      - name: Verify audit evidence
        run: |
          test -s artifacts/audit-governance-self-test/report.json
          test -s artifacts/audit-governance-self-test/report.md
          test -s artifacts/global-audit-policy/report.json
          test -s artifacts/global-audit-policy/report.md
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-governance-${{ github.run_id }}
          path: |
            artifacts/audit-governance-self-test/
            artifacts/global-audit-policy/
          if-no-files-found: error
          retention-days: 90
