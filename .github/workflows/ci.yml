name: Amazon Returns CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, curl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PHP tests
        run: |
          set -e
          for test in tests/*.php; do php "$test"; done
          php scripts/audit-tenant-sql.php
          php tests/amazon-returns-tenant-isolation-test.php
      - name: Node tests
        run: |
          set -e
          node --test tests/*.test.mjs
      - name: TOTP tests
        run: |
          set -e
          python3 tests/totp-current.test.py
          python3 -m py_compile scripts/amazon-returns/totp-current.py
      - name: Continuity controller tests
        run: |
          set -e
          python3 -m unittest discover -s tests/continuity -p 'test_*.py' -v
          python3 -m py_compile tools/continuity/*.py
          python3 -m py_compile scripts/migrate-continuity-config.py
          python3 -m py_compile scripts/migrate-continuity-state-layout.py
          python3 -m py_compile scripts/enable-continuity-auto-dispatch.py
          python3 -m py_compile scripts/prepare-continuity-runtime-config.py
          python3 -m py_compile scripts/run-continuity-pilot.py
          bash -n scripts/run-continuity-pilot.sh
          bash -n scripts/install-continuity-controller.sh
          bash -n scripts/provision-continuity-gemini-env.sh
          bash -n scripts/provision-continuity-publisher-key.sh
      - name: Global audit governance parity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-audit-governance.py --output-dir artifacts/audit-governance-self-test
          python3 scripts/validate-global-audit-policy.py --output-dir artifacts/global-audit-policy

      - name: Syntax and security contracts
        run: |
          set -e
          find includes api admin workers scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check admin/amazon-returns/assets/cockpit-operational.js
          node --check scripts/amazon-returns/safe-t-status-parser.mjs
          node --check scripts/amazon-returns/seller-central-auth.mjs
          node --check scripts/amazon-returns/seller-central-safe-t-read-worker.mjs
          node --check scripts/amazon-returns/seller-central-bridge-worker.mjs
          bash -n scripts/install-service.sh
          bash -n scripts/auto-deploy.sh
          bash -n scripts/request-olist-erp-login-sync.sh
          bash -n scripts/sync-olist-erp-login-env.sh
          python3 -m py_compile scripts/validate-olist-erp-login-env.py
          bash -n scripts/provision-production.sh
          bash -n scripts/verify-live-tenant-foundation.sh
          bash -n scripts/amazon-returns/run-seller-central-daily.sh
          bash -n scripts/provision-seller-central-browser-host.sh
          bash -n scripts/provision-amazon-totp-authenticator.sh
          if git grep -n -E 'StrictHostKeyChecking=no|BEGIN OPENSSH PRIVATE KEY|otpauth://' -- scripts deploy includes api admin workers; then
            echo 'Prohibited secret/SSH weakening marker found.' >&2
            exit 1
          fi
          git diff --check HEAD^
